apiVersion: apps/v1
kind: Deployment
metadata:
  name: securenotes-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: securenotes-api
  template:
    metadata:
      labels:
        app: securenotes-api
    spec:
      containers:
      - name: api
        image: securenotes-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
       
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
            
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 15
          
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 10001
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
          
          privileged: true